name: Deploy API to Fly.io

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - 'package-lock.json'
      - '.github/workflows/deploy-api.yml'

jobs:
  # Deploy only what passes the tests (CI runs separately and doesn't gate this).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @text-them/shared
      - run: npm run typecheck --workspace @text-them/api
      - run: npm test --workspace @text-them/api

  deploy:
    needs: test
    runs-on: ubuntu-latest
    concurrency: deploy-api
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # Build context is the repo root (monorepo); Dockerfile lives in apps/api.
      # GIT_SHA / BUILT_AT stamp the image so the dashboard's Help page can show it.
      - run: >-
          flyctl deploy --remote-only --config apps/api/fly.toml --dockerfile apps/api/Dockerfile
          --build-arg GIT_SHA=${{ github.sha }}
          --build-arg BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          .
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
